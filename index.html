<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
      <meta name="x5-fullscreen" content="true">
      <meta name="full-screen" content="yes">
      <mate name="apple-mobile-web-app-capable" content="yes" />
      <mate name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
      <meta name="viewport" content="width=device-width,initial-scale=1,minimum-scale=1,maximum-scale=1,viewport-fit=cover,user-scalable=no" />
      <meta name="full-screen" content="true" />
      <script>
      var coverSupport = 'CSS' in window && typeof CSS.supports === 'function' && (CSS.supports('top: env(a)') ||
        CSS.supports('top: constant(a)'))
      document.write(
        '<meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0' +
        (coverSupport ? ', viewport-fit=cover' : '') + '" />')
    </script>
      <link rel="icon" href="/static/logo/h5Logo1.png">
      <!-- 添加到主屏幕图标 -->
      <link rel="apple-touch-icon" href="/static/logo/h5Logo1.png">
      <!-- 指定图标的大小 -->
      <link rel="apple-touch-icon-precomposed" href="/static/logo/h5Logo1.png">

    <title></title>
    <!--preload-links-->
    <!--app-context-->
  </head>
